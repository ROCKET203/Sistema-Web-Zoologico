<div>
<h4>Lista de especies</h4>
<table class="table table-hovered table-stripped">
<thead>
<th>Id</th>
<th>nombre vulgar</th>
<th>nombre cientifico</th>
<th>familia</th>
<th>estado</th>

</thead>
<tbody>
@for(datos of data;track datos){
<tr>
<td>{{datos.id}}</td>
<td>{{datos.nombre_vulgar}}</td>
<td>{{datos.nombre_cientifico}}</td>
<td>{{datos.familia}}</td>
<td>{{datos.estado}}</td>

</tr>
}
</tbody>
</table>
</div>
